# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml

kind: hosted
name: browser-automation-agent-sample-foundry
description: |
    A Foundry-hosted browser automation agent sample with selectable profiles for general browsing, web scraping, form filling, and QA testing.
metadata:
    tags:
        - Agent Framework
        - AI Agent Hosting
        - Azure AI AgentServer
        - Responses Protocol
        - Browser Automation
protocols:
    - protocol: responses
      version: 1.0.0
resources:
    cpu: "0.25"
    memory: 0.5Gi
environment_variables:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: gpt-4o-mini
    - name: AZURE_PLAYWRIGHT_SERVICE_URL
      value: '{{AZURE_PLAYWRIGHT_SERVICE_URL}}'
    - name: AZURE_PLAYWRIGHT_SERVICE_ACCESS_TOKEN
      value: '{{AZURE_PLAYWRIGHT_SERVICE_ACCESS_TOKEN}}'
    - name: BROWSER_AGENT_PROFILE
      value: general
    - name: BROWSER_AGENT_PLAYWRIGHT_CLI_TIMEOUT_SECONDS
      value: "180"
    - name: BROWSER_AGENT_MCP_TIMEOUT_SECONDS
      value: "120"
