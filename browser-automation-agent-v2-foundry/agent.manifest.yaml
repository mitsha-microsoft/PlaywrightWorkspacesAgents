name: browser-automation-agent-v2-foundry
description: >
  A Foundry-hosted Microsoft Agent Framework browser automation agent using
  Azure Playwright Service MCP and Browser Use CLI.
metadata:
  tags:
    - Agent Framework
    - AI Agent Hosting
    - Azure AI AgentServer
    - Responses Protocol
    - Browser Automation
template:
  name: browser-automation-agent-v2-foundry
  kind: hosted
  protocols:
    - protocol: responses
      version: 1.0.0
  environment_variables:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: "{{AZURE_AI_MODEL_DEPLOYMENT_NAME}}"
    - name: AZURE_PLAYWRIGHT_SERVICE_URL
      value: "{{AZURE_PLAYWRIGHT_SERVICE_URL}}"
    - name: AZURE_PLAYWRIGHT_SERVICE_ACCESS_TOKEN
      value: "{{AZURE_PLAYWRIGHT_SERVICE_ACCESS_TOKEN}}"
    - name: BROWSER_AGENT_SHELL_TIMEOUT_SECONDS
      value: "{{BROWSER_AGENT_SHELL_TIMEOUT_SECONDS}}"
    - name: BROWSER_AGENT_MCP_TIMEOUT_SECONDS
      value: "{{BROWSER_AGENT_MCP_TIMEOUT_SECONDS}}"
resources:
  - kind: model
    id: gpt-5.4
    name: AZURE_AI_MODEL_DEPLOYMENT_NAME
