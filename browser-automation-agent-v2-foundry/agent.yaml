# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml

kind: hosted
name: browser-automation-agent-v2-foundry
description: |
    A Foundry-hosted Microsoft Agent Framework browser automation agent using Azure Playwright Service MCP and Browser Use CLI.
metadata:
    tags:
        - Agent Framework
        - AI Agent Hosting
        - Azure AI AgentServer
        - Responses Protocol
        - Browser Automation
protocols:
    - protocol: responses
      version: 1.0.0
resources:
    cpu: "0.25"
    memory: 0.5Gi
environment_variables:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: gpt-5.4
    - name: AZURE_PLAYWRIGHT_SERVICE_URL
      value: '{{AZURE_PLAYWRIGHT_SERVICE_URL}}'
    - name: AZURE_PLAYWRIGHT_SERVICE_ACCESS_TOKEN
      value: '{{AZURE_PLAYWRIGHT_SERVICE_ACCESS_TOKEN}}'
    - name: BROWSER_AGENT_SHELL_TIMEOUT_SECONDS
      value: '{{BROWSER_AGENT_SHELL_TIMEOUT_SECONDS}}'
    - name: BROWSER_AGENT_MCP_TIMEOUT_SECONDS
      value: '{{BROWSER_AGENT_MCP_TIMEOUT_SECONDS}}'
