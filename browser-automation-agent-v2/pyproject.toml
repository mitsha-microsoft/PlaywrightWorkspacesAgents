[project]
name = "browser-automation-agent-v2"
version = "0.1.0"
description = "Command-line browser automation agent backed by Microsoft Agent Framework, Azure Playwright Service MCP, and browser-use CLI."
requires-python = ">=3.11"
dependencies = [
    "agent-framework>=1.0.0",
    "agent-framework-foundry>=1.0.0",
    "azure-identity>=1.19.0",
    "browser-use>=0.12.6",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
browser-automation-agent-v2 = "browser_automation_agent_v2.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browser_automation_agent_v2"]

[tool.uv]
package = true
