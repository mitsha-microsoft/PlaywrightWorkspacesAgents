[project]
name = "browser-automation-agent"
version = "0.1.0"
description = "Command-line browser automation agent backed by Azure Playwright Service MCP and browser-use CLI."
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.19.0",
    "browser-use>=0.12.6",
    "bu-agent-sdk>=0.0.1",
    "mcp>=1.0.0",
]

[project.scripts]
browser-automation-agent = "browser_automation_agent.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browser_automation_agent"]

[tool.uv]
package = true
